name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present
      - run: npm test -- --coverage
      - name: Sample data is repeatable
        run: |
          npm run generate --workspace @drawwatch/shared
          git diff --exit-code apps/api/data/draws.json
