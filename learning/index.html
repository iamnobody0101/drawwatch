<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DrawWatch playground</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>DrawWatch</h1>
    </header>
    <main>
      <h2>Results</h2>
      <label for="game">Game:</label>
      <select id="game">
        <option value="all">All Games</option>
        <option value="Lotto 6/49">Lotto 6/49</option>
        <option value="Lotto Max">Lotto Max</option>
      </select>
      <div id="draws" aria-live="polite"></div>
    </main>
    <footer>
      <p>Sample data only. Not affiliated with OLG.</p>
    </footer>
    <script src="app.js" defer></script>
  </body>
</html>
